name: Build ANAS FC APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'ANAS_FC_Manager_Cloud_Build.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANAS_FC_Manager_Cloud_Build.zip was not found in the repository."
            echo "Files in repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts after extraction."
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug

          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build finished but no debug APK was found."
            find "$PROJECT_DIR" -type f | grep -E '\\.apk$' || true
            exit 1
          fi

          mkdir -p output/apk
          cp "$APK_FILE" output/apk/ANAS-FC-Manager-debug.apk
          echo "APK ready: output/apk/ANAS-FC-Manager-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANAS-FC-Manager-APK
          path: output/apk/ANAS-FC-Manager-debug.apk
          if-no-files-found: error
